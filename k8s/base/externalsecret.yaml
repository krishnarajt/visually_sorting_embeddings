apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vsembeddings-env
  namespace: vsembeddings
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vsembeddings-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Vault key holding the env for this app. Expected keys, both optional:
        #   OPENAI_KEY, COHERE_KEY
        # Without OPENAI_KEY the two OpenAI sources are greyed out in the UI,
        # without COHERE_KEY the Cohere one is — and the translate-to-English
        # step for words you type yourself also needs OPENAI_KEY.
        key: apps/vsembeddings/vsembeddings/env
